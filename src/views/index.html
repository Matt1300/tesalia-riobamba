<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesalia Riobamba</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --primary: #1a73e8;
        --primary-dark: #1557b0;
        --secondary: #34a853;
        --danger: #ea4335;
        --warning: #fbbc04;
        --text: #202124;
        --text-muted: #5f6368;
        --border: #dadce0;
        --bg: #f8f9fa;
        --surface: #ffffff;
        --sidebar-w: 240px;
        --topbar-h: 56px;
        --radius: 8px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.12);
        --transition: 0.2s ease;
      }
      html,
      body {
        height: 100%;
        font-family: "Google Sans", Roboto, sans-serif;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
      }

      /* Loading */
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
        color: var(--text-muted);
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Layout */
      .layout {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: var(--sidebar-w);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: transform var(--transition);
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-logo {
        font-size: 24px;
      }
      .sidebar-title {
        font-weight: 600;
        font-size: 14px;
        color: var(--text);
        line-height: 1.2;
      }
      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .nav-section {
        padding: 8px 16px 4px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        cursor: pointer;
        color: var(--text-muted);
        transition:
          background var(--transition),
          color var(--transition);
        font-size: 14px;
      }
      .nav-item:hover {
        background: var(--bg);
        color: var(--text);
      }
      .nav-item.active {
        background: #e8f0fe;
        color: var(--primary);
        font-weight: 500;
      }
      .nav-item .nav-icon {
        font-size: 18px;
        width: 22px;
        text-align: center;
      }
      .sidebar-footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
      }
      .sidebar-user-email {
        display: block;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 8px;
        word-break: break-all;
      }
      .btn-logout {
        width: 100%;
        padding: 8px;
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--danger);
        font-size: 13px;
        transition: background var(--transition);
      }
      .btn-logout:hover {
        background: #fce8e6;
      }

      /* Main */
      .main-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Topbar */
      .topbar {
        height: var(--topbar-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 20px;
        flex-shrink: 0;
        box-shadow: var(--shadow);
      }
      .sidebar-toggle {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 20px;
        color: var(--text-muted);
        display: none;
      }
      .page-title {
        font-size: 18px;
        font-weight: 500;
        flex: 1;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .topbar-user {
        font-size: 13px;
        color: var(--text-muted);
      }
      .badge {
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge-admin {
        background: #e8f0fe;
        color: var(--primary);
      }
      .badge-chofer {
        background: #e6f4ea;
        color: var(--secondary);
      }

      /* Content */
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }

      /* Cards */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: var(--shadow);
      }
      .card-title {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 16px;
        color: var(--text);
      }
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: var(--shadow);
      }
      .stat-label {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      .stat-value {
        font-size: 28px;
        font-weight: 600;
        color: var(--primary);
      }
      .stat-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      /* Botones */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        transition: background var(--transition);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-dark);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        background: var(--bg);
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-danger:hover {
        background: #c62828;
      }
      .btn-sm {
        padding: 4px 10px;
        font-size: 12px;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Tabla */
      .table-wrapper {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        background: var(--bg);
        color: var(--text-muted);
        font-weight: 600;
        text-align: left;
        padding: 10px 12px;
        border-bottom: 2px solid var(--border);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr:hover td {
        background: #f8f9ff;
      }
      tfoot td {
        font-weight: 600;
        background: var(--bg);
      }
      .empty-state {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .empty-state-icon {
        font-size: 40px;
      }

      /* Estado badges */
      .status {
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .status-no-pagado {
        background: #fff3e0;
        color: #e65100;
      }
      .status-pagado {
        background: #e6f4ea;
        color: #1e7e34;
      }

      /* Badge extras */
      .badge-activo {
        background: #e6f4ea;
        color: #1e7e34;
      }
      .badge-inactivo {
        background: #f5f5f5;
        color: #999;
      }
      .badge-urbana {
        background: #e8f0fe;
        color: #1557b0;
      }
      .badge-rural {
        background: #fce8e6;
        color: #c62828;
      }

      /* Formularios */
      .form-group {
        margin-bottom: 16px;
      }
      .form-label {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }
      .form-control {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 14px;
        color: var(--text);
        background: var(--surface);
        transition: border-color var(--transition);
      }
      .form-control:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
      }
      .form-control:read-only {
        background: var(--bg);
        color: var(--text-muted);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      /* Toolbar y filtros */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .filter-bar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .filter-bar .form-control {
        width: auto;
        min-width: 140px;
      }
      .filter-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .filter-field .form-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 0;
      }

      /* Acciones en tabla */
      .action-btns {
        display: flex;
        gap: 4px;
      }
      .btn-icon {
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 3px 8px;
        cursor: pointer;
        font-size: 13px;
        transition: background var(--transition);
        line-height: 1.4;
      }
      .btn-icon:hover {
        background: var(--bg);
      }
      .btn-icon:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-xls {
        background: #e6f4ea;
        color: #1e6b35;
        border-color: #a8d5b5;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.3px;
      }
      .btn-xls:hover {
        background: #c8e6c9;
      }
      .btn-pdf-r {
        background: #fce8e6;
        color: #b71c1c;
        border-color: #f5a8a3;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.3px;
      }
      .btn-pdf-r:hover {
        background: #ffcdd2;
      }
      .btn-det {
        background: #e8f0fe;
        color: #1557b0;
        border-color: #a8c4f5;
        font-size: 11px;
      }
      .btn-det:hover {
        background: #d2e3fc;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-dialog {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        width: 100%;
        max-width: 560px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .modal-title {
        font-size: 16px;
        font-weight: 500;
      }
      .modal-close {
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        color: var(--text-muted);
        line-height: 1;
        padding: 0 4px;
      }
      .modal-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }

      /* Toast */
      .toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 300;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .toast {
        padding: 10px 18px;
        border-radius: var(--radius);
        font-size: 13px;
        color: #fff;
        box-shadow: var(--shadow-md);
        animation: toastIn 0.2s ease;
        max-width: 340px;
      }
      .toast-success {
        background: var(--secondary);
      }
      .toast-error {
        background: var(--danger);
      }
      .toast-info {
        background: var(--primary);
      }
      @keyframes toastIn {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* Sin acceso */
      .no-access {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        gap: 12px;
        color: var(--text-muted);
      }
      .no-access-icon {
        font-size: 56px;
      }
      .no-access h2 {
        font-size: 24px;
        color: var(--text);
      }

      /* Sidebar backdrop */
      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 99;
      }
      .sidebar-backdrop.visible {
        display: block;
      }

      /* Stat card mejorado */
      .stat-card {
        position: relative;
        overflow: hidden;
      }
      .stat-card::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: var(--primary);
        border-radius: 2px 0 0 2px;
      }
      .stat-card.accent-green::before { background: var(--secondary); }
      .stat-card.accent-blue::before { background: #1565c0; }
      .stat-card.accent-orange::before { background: #f57c00; }
      .stat-card.accent-red::before { background: var(--danger); }
      .stat-card.accent-purple::before { background: #7b1fa2; }
      .stat-icon {
        font-size: 22px;
        margin-bottom: 8px;
        display: block;
      }
      .stat-card { padding-left: 20px; }

      /* Grid responsive para stats en reportes */
      .stats-grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }

      /* Filtros colapsables en mobile */
      .filter-toggle {
        display: none;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        margin-bottom: 8px;
      }
      .filter-collapsible { display: contents; }

      /* FAB (Floating Action Button) para mobile */
      .fab {
        display: none;
        position: fixed;
        bottom: 24px;
        right: 20px;
        z-index: 50;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        font-size: 28px;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(26,115,232,0.4);
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      /* Tabla responsiva — modo tarjeta en mobile */
      @media (max-width: 768px) {
        table.resp-table thead { display: none; }
        table.resp-table tbody tr {
          display: block;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          margin-bottom: 10px;
          box-shadow: var(--shadow);
        }
        table.resp-table tbody td {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 9px 14px;
          border-bottom: 1px solid var(--border);
          font-size: 13px;
        }
        table.resp-table tbody td:last-child { border-bottom: none; }
        table.resp-table tbody td::before {
          content: attr(data-label);
          font-weight: 600;
          color: var(--text-muted);
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.4px;
          margin-right: 12px;
          flex-shrink: 0;
        }
        table.resp-table tfoot { display: none; }
        .table-wrapper { overflow-x: unset; }
        .stats-grid-4 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .fab { display: flex; }
        .fab-spacer { height: 80px; }
      }

      /* Responsive */
      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          height: 100%;
          z-index: 100;
          transform: translateX(-100%);
        }
        .sidebar.open {
          transform: translateX(0);
          box-shadow: var(--shadow-md);
        }
        .sidebar-toggle {
          display: block;
        }
        .content {
          padding: 12px;
        }
        .card {
          padding: 14px;
        }
        .cards-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
          margin-bottom: 14px;
        }
        .stat-card {
          padding: 14px 14px 14px 20px;
        }
        .stat-value {
          font-size: 22px;
        }
        .form-row {
          grid-template-columns: 1fr;
        }
        .filter-toggle { display: block; }
        .filter-collapsible.collapsed { display: none; }
        .filter-bar {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }
        .filter-bar .form-control {
          min-width: unset;
          width: 100%;
        }
        .filter-field {
          width: 100%;
        }
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }
        .toolbar > .btn,
        .toolbar > button {
          width: 100%;
          justify-content: center;
        }
        .topbar-user {
          display: none;
        }
        .btn {
          min-height: 44px;
        }
        .btn-icon {
          min-height: 38px;
          padding: 6px 12px;
          font-size: 13px;
        }
        .form-control {
          min-height: 44px;
          font-size: 16px; /* evita zoom en iOS */
        }
        .modal-overlay {
          padding: 0;
          align-items: flex-end;
        }
        .modal-dialog {
          max-width: 100%;
          max-height: 94vh;
          border-radius: 20px 20px 0 0;
        }
        .modal-footer {
          padding-bottom: max(24px, env(safe-area-inset-bottom));
        }
        .modal-footer .btn {
          flex: 1;
        }
        .toast-container {
          bottom: 88px;
          left: 12px;
          right: 12px;
        }
        .toast {
          max-width: 100%;
        }
        .nav-item {
          padding: 14px 16px;
          font-size: 15px;
        }
        .nav-item .nav-icon {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Cargando sistema...</p>
      </div>
    </div>

    <template id="tpl-layout">
      <div class="layout">
        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <span class="sidebar-logo">&#x1F69B;</span>
            <span class="sidebar-title" id="app-nombre"></span>
          </div>
          <nav class="sidebar-nav" id="sidebar-nav"></nav>
          <div class="sidebar-footer">
            <span id="sidebar-user-email" class="sidebar-user-email"></span>
            <button class="btn-logout" id="btn-logout">
              Cerrar sesi&#243;n
            </button>
          </div>
        </aside>
        <div class="main-wrapper">
          <header class="topbar">
            <button class="sidebar-toggle" id="sidebar-toggle">&#9776;</button>
            <h1 class="page-title" id="page-title">Dashboard</h1>
            <div class="topbar-right">
              <span class="topbar-user" id="topbar-user"></span>
              <span class="badge" id="topbar-role"></span>
            </div>
          </header>
          <main class="content" id="content"></main>
        </div>
      </div>
    </template>

    <template id="tpl-no-access">
      <div class="no-access">
        <div class="no-access-icon">&#x1F6AB;</div>
        <h2>Sin acceso</h2>
        <p>Su cuenta no tiene acceso al sistema.</p>
        <p>Contacte al administrador para solicitar acceso.</p>
      </div>
    </template>

    <script>
      /* ─── API Client ─────────────────────────────────────────────────────────── */
      var API = {
        call: function (action, payload) {
          return new Promise(function (resolve, reject) {
            google.script.run
              .withSuccessHandler(function (res) {
                try {
                  var parsed = typeof res === "string" ? JSON.parse(res) : res;
                  if (!parsed) {
                    reject(new Error("Respuesta vacía del servidor"));
                    return;
                  }
                  if (parsed.success) resolve(parsed.data);
                  else reject(new Error(parsed.error || "Error desconocido"));
                } catch (e) {
                  reject(
                    new Error("Error al procesar respuesta: " + e.message),
                  );
                }

      /* ─── Router ─────────────────────────────────────────────────────────────── */
      var Router = {
        routes: {},
        register: function (path, renderer) {
          this.routes[path] = renderer;
        },
        navigate: function (path) {
          window.location.hash = path;
        },
        start: function () {
          var self = this;
          window.addEventListener("hashchange", function () {
            self._render();
          });
          this._render();
        },
        _render: function () {
          var path = window.location.hash.slice(1) || "registros";
          var renderer = this.routes[path];

          // Reemplazar el elemento #content en cada navegación.
          // Los callbacks async pendientes de la página anterior siguen
          // referenciando el elemento viejo (ahora desconectado del DOM),
          // así sus escrituras son invisibles y no afectan la nueva página.
          var old = document.getElementById("content");
          var content = document.createElement("main");
          content.className = "content";
          content.id = "content";
          if (old) {
            old.parentNode.replaceChild(content, old);
          }

          document.querySelectorAll(".nav-item").forEach(function (el) {
            el.classList.toggle("active", el.dataset.route === path);
          });
          if (renderer) {
            var pt = document.getElementById("page-title");
            if (pt) pt.textContent = renderer.title || path;
            renderer.render(content);
          } else {
            content.innerHTML =
              '<div class="card"><p>P\u00e1gina no encontrada: ' +
              path +
              "</p></div>";
          }
        },
      };

      /* ─── Toast ──────────────────────────────────────────────────────────────── */
      var Toast = {
        _c: null,

          if (!this._c) {
            this._c = document.createElement("div");
            this._c.className = "toast-container";
            document.body.appendChild(this._c);
          }
          return this._c;
        },
        show: function (msg, type) {
          var el = document.createElement("div");
          el.className = "toast toast-" + (type || "info");
          el.textContent = msg;
          this._container().appendChild(el);
          setTimeout(function () {
            el.remove();
          }, 3500);
        },
        success: function (msg) {
          this.show(msg, "success");
        },
        error: function (msg) {
          this.show(msg, "error");
        },
        info: function (msg) {
          this.show(msg, "info");
        },
      };

      /* ─── Modal ──────────────────────────────────────────────────────────────── */
      var Modal = {
        _el: null,
        show: function (opts) {
          var title = opts.title || "";
          var body = opts.body || "";
          var onSave = opts.onSave || null;
          var saveLabel = opts.saveLabel || "Guardar";
          var danger = opts.danger || false;
          if (this._el) this._el.remove();
          this._el = document.createElement("div");
          this._el.className = "modal-overlay";
          this._el.innerHTML =
            '<div class="modal-dialog">' +
            '<div class="modal-header">' +
            '<span class="modal-title">' +
            title +
            "</span>" +
            '<button class="modal-close" type="button">&times;</button>' +
            "</div>" +
            '<div class="modal-body">' +
            body +
            "</div>" +
            '<div class="modal-footer">' +
            '<button class="btn btn-secondary modal-cancel" type="button">Cancelar</button>' +
            (onSave
              ? '<button class="btn ' +
                (danger ? "btn-danger" : "btn-primary") +
                ' modal-save" type="button">' +
                saveLabel +
                "</button>"
              : "") +
            "</div>" +
            "</div>";
          document.body.appendChild(this._el);
          var self = this;
          this._el.querySelector(".modal-close").onclick = function () {
            self.hide();
          };
          this._el.querySelector(".modal-cancel").onclick = function () {
            self.hide();
          };
          if (onSave) this._el.querySelector(".modal-save").onclick = onSave;
          this._el.onclick = function (e) {
            if (e.target === self._el) self.hide();
          };
        },
        hide: function () {
          if (this._el) {
            this._el.remove();
            this._el = null;
          }
        },
        val: function (id) {
          var el = this._el && this._el.querySelector("#" + id);
          return el ? el.value.trim() : "";
        },
        setLoading: function (on) {
          var btn = this._el && this._el.querySelector(".modal-save");
          if (btn) {
            btn.disabled = on;
            btn.textContent = on
              ? "Guardando..."
              : btn.dataset.label || "Guardar";
          }
        },
      };

      /* ─── UI Helpers ─────────────────────────────────────────────────────────── */
      var UI = {
        showLoading: function (container, msg) {
          container.innerHTML =
            '<div class="empty-state"><div class="loading-spinner"></div><p>' +
            (msg || "Cargando...") +

        showError: function (container, msg) {

            '<div class="empty-state"><p style="color:var(--danger)">&#9888; ' +
            msg +
            "</p></div>";
        },
        formatCurrency: function (amount) {
          return "$" + Number(amount || 0).toFixed(2);
        },
        formatDate: function (val) {
          if (!val) return "-";
          var s = typeof val === "string" ? val : new Date(val).toISOString();
          var p = s.split("T")[0].split("-");
          return p[2] + "/" + p[1] + "/" + p[0];
        },
        formatDateTime: function (val) {
          if (!val) return "-";
          try {
            return new Date(val).toLocaleString("es-EC", {
              timeZone: "America/Guayaquil",
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            });
          } catch (e) {
            return String(val);
          }
        },
        statusBadge: function (estado) {
          var map = {
            NO_PAGADO: "status-no-pagado",
            PAGADO: "status-pagado",
            // backward compat con registros viejos
            PENDIENTE: "status-no-pagado",
            VALIDADO: "status-pagado",
            RECHAZADO: "status-no-pagado",
          };
          var label = {
            NO_PAGADO: "No pagado", PAGADO: "Pagado",
            PENDIENTE: "No pagado", VALIDADO: "Pagado", RECHAZADO: "No pagado",
          };
          return (
            '<span class="status ' +
            (map[estado] || "") +
            '">' +
            (label[estado] || estado || "-") +
            "</span>"
          );
        },
        activoBadge: function (activo) {
          return activo
            ? '<span class="badge badge-activo">Activo</span>'
            : '<span class="badge badge-inactivo">Inactivo</span>';
        },
        operacionBadge: function (op, zona, cantidad) {
          if (!op) return "-";
          var colorOp = op === "ENTREGA"
            ? "background:#e8f5e9;color:#2e7d32"
            : "background:#e3f2fd;color:#1565c0";
          var colorZona = zona === "URBANO"
            ? "background:#f3e5f5;color:#6a1b9a"
            : zona === "FORANEO"
            ? "background:#fff3e0;color:#e65100"
            : "background:#fce8e6;color:#b71c1c";
          var cantidadTag = op === "RECARGUE" && cantidad > 1
            ? ' <span style="font-size:10px;background:#1565c0;color:#fff;border-radius:10px;padding:1px 5px">&times;' + cantidad + "</span>"
            : "";
          return (
            '<span class="badge" style="' + colorOp + '">' + op + "</span> " +
            '<span class="badge" style="' + colorZona + '">' + (zona || "") + "</span>" +
            cantidadTag
          );
        },
        rutaBadge: function (tipo) {
          if (!tipo) return "-";
          return '<span class="badge">' + tipo + "</span>";
        },
        choferName: function (choferes, id) {
          var c = choferes.filter(function (x) {
            return x.choferId === id;

          return c ? c.nombre : id || "-";
        },
        camionPatente: function (camiones, id) {
          var c = camiones.filter(function (x) {

          })[0];

        choferOptions: function (choferes, selected) {

      /* ─── Utilidades ─────────────────────────────────────────────────────────── */
      function currentYearMonth() {
        var d = new Date();
        return { anio: d.getFullYear(), mes: d.getMonth() + 1 };
      }
      function isoToday() {
        return new Date().toISOString().split("T")[0];
      }
      function monthOptions(selected) {
        var names = [
          "Enero",
          "Febrero",
          "Marzo",
          "Abril",
          "Mayo",
          "Junio",
          "Julio",
          "Agosto",
          "Septiembre",
          "Octubre",
          "Noviembre",
          "Diciembre",
        ];
        return names
          .map(function (n, i) {
            return (
              '<option value="' +
              (i + 1) +
              '"' +
              (i + 1 === selected ? " selected" : "") +
              ">" +
              n +
              "</option>"
            );
          })
          .join("");
      }
      function yearOptions(selected) {
        var cur = new Date().getFullYear();
        var html = "";
        for (var y = cur; y >= cur - 3; y--)
          html +=
            '<option value="' +
            y +
            '"' +
            (y === selected ? " selected" : "") +
            ">" +
            y +
            "</option>";
        return html;
      }

      /* ─── Registros ──────────────────────────────────────────────────────────── */
      function makeRegistrosPage(session) {
        var isAdmin = session.rol === "ADMIN";
        var _choferes = [],
          _camiones = [],
          _data = [],
          _filtro = {},
          _pageSize = 40,
          _page = 1;

        function _load(container, filtro) {
          _filtro = filtro || {};
          _page = 1;
          UI.showLoading(container);
          Promise.all([API.choferes.getAll(), API.camiones.getAll()])
            .then(function (r) {
              _choferes = r[0];
              _camiones = r[1];
              return API.registros.filtrar(_filtro);
            })
            .then(function (data) {
              _data = data;
              _renderPage(container);
            })
            .catch(function (e) {
              UI.showError(container, e.message);
            });
        }

        function _renderRows(container) {
          // Ordenar por fecha DESC (más reciente primero)
          var sorted = _data.slice().sort(function (a, b) {
            return (b.fecha || "").localeCompare(a.fecha || "");
          });
          var visible = sorted.slice(0, _page * _pageSize);
          var hayMas = visible.length < sorted.length;

          var rows = visible.map(function (r) {
            var canEdit = isAdmin || r.choferId === session.choferId;

            if (isAdmin)
              btns += '<button class="btn-icon" data-action="delete" data-id="' + r.registroId + '" title="Eliminar">&#128465;</button>';
            return (
              "<tr>" +
              '<td data-label="Fecha">' + UI.formatDate(r.fecha) + "</td>" +

            );
          }).join("");

          var tbody = container.querySelector("#reg-tbody");
          var countEl = container.querySelector("#reg-count");
          var moreBtn = container.querySelector("#btn-mas-reg");
          if (tbody) tbody.innerHTML = sorted.length === 0
            ? '<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text-muted)">&#128203; Sin registros para los filtros seleccionados</td></tr>'
            : rows;
          if (countEl) countEl.textContent = "Registros (" + _data.length + ")";
          if (moreBtn) moreBtn.style.display = hayMas ? "" : "none";

          container.querySelectorAll("[data-action]").forEach(function (btn) {
            btn.onclick = function () {
              var id = btn.dataset.id;
              var r = _data.filter(function (x) { return x.registroId === id; })[0];
              if (btn.dataset.action === "edit") _openEdit(container, r);

            placaField = '<div class="form-group"><label class="form-label">Placa *</label><select class="form-control" id="m-placa"><option value="">-- Elige un conductor primero --</option></select></div>';
          }

          return (
            '<div class="form-row">' +
            '<div class="form-group"><label class="form-label">Fecha *</label><input type="date" class="form-control" id="m-fecha" value="' + fecha + '"></div>' +
            '<div class="form-group"></div>' +
            '</div><div class="form-row">' +
            choferField +
            placaField +
            '</div><div class="form-row">' +
            '<div class="form-group"><label class="form-label">Transporte *</label><input type="number" class="form-control" id="m-transporte" value="' + (r ? r.transporte || "" : "") + '" placeholder="N\u00famero" maxlength="10"></div>' +
            '<div class="form-group"><label class="form-label">Ruta *</label><input type="number" class="form-control" id="m-ruta" value="' + (r ? r.ruta || "" : "") + '" placeholder="N\u00famero" maxlength="10"></div>' +
            '</div><div class="form-row">' +
            '<div class="form-group"><label class="form-label">Tipo de operaci&#243;n *</label><select class="form-control" id="m-op"><option value="ENTREGA"' + (op === "ENTREGA" ? " selected" : "") + '>Entrega</option><option value="RECARGUE"' + (op === "RECARGUE" ? " selected" : "") + '>Recargue</option></select></div>' +
            '<div class="form-group"><label class="form-label">Tipo de zona *</label><select class="form-control" id="m-zona"><option value="URBANO"' + (zona === "URBANO" ? " selected" : "") + '>Urbano</option><option value="FORANEO"' + (zona === "FORANEO" ? " selected" : "") + '>For\u00e1neo</option><option value="EXTRAFORANEO"' + (zona === "EXTRAFORANEO" ? " selected" : "") + '>Extrafor\u00e1neo</option></select></div>' +
            '</div><div class="form-row" id="m-recargues-row" style="' + (op === "RECARGUE" ? "" : "display:none") + '">' +
            '<div class="form-group"><label class="form-label">Cantidad de recargues *</label><select class="form-control" id="m-cantidad">' + cantOpts + '</select></div>' +
            '<div class="form-group"></div>' +
            '</div><div class="form-row">' +
            '<div class="form-group"><label class="form-label">Kilometraje *</label><input type="number" class="form-control" id="m-km" value="' + (r ? r.kilometraje || "" : "") + '" placeholder="Km" min="0"></div>' +
            '<div class="form-group"><label class="form-label">&#191;Tuvo rechazos?</label><select class="form-control" id="m-rechazos"><option value="false"' + (r && r.tieneRechazos ? "" : " selected") + '>No</option><option value="true"' + (r && r.tieneRechazos ? " selected" : "") + '>S\u00ed (-$5)</option></select></div>' +
            '</div><div class="form-row">' +

        function _openCreate(container) {
          var fixedChoferId = isAdmin ? null : session.choferId;
          Modal.show({
            title: "Nuevo Registro",
            body: _form(null, fixedChoferId),
            onSave: function () {
              var fecha = Modal.val("m-fecha"),
                placa = Modal.val("m-placa").toUpperCase(),
                transporte = Modal.val("m-transporte"),
                ruta = Modal.val("m-ruta"),
                km = Modal.val("m-km"),
                choferId = Modal.val("m-chofer");
              if (!fecha || !placa || !transporte || !ruta || !km || !choferId) {
                Toast.error("Completa todos los campos requeridos");
                return;
              }
              var camion = _camiones.filter(function(c) { return c.patente.toUpperCase() === placa; })[0];
              if (!camion) { Toast.error("No se encontró un camión con placa " + placa); return; }
              var op = Modal.val("m-op");
              Modal.setLoading(true);
              API.registros
                .crear({
                  fecha: fecha,
                  choferId: choferId,
                  camionId: camion.camionId,
                  placa: placa,
                  transporte: transporte,
                  ruta: ruta,
                  tipoOperacion: op,
                  tipoZona: Modal.val("m-zona"),
                  cantidadRecargues: op === "RECARGUE" ? parseInt(Modal.val("m-cantidad")) || 1 : 1,
                  kilometraje: parseFloat(km) || 0,
                  tieneRechazos: Modal.val("m-rechazos") === "true",
                  observaciones: Modal.val("m-obs") || undefined,
                  origen: "MANUAL",
                })
                .then(function () {
                  Modal.hide();
                  Toast.success("Registro creado");
                  _load(container, _filtro);
                })
                .catch(function (e) {
                  Modal.setLoading(false);
                  Toast.error(e.message);
                });
            },
          });

          // Mostrar/ocultar cantidad de recargues según operación
          var opSel = Modal._el.querySelector("#m-op");
          var cantRow = Modal._el.querySelector("#m-recargues-row");
          opSel.addEventListener("change", function () {
            cantRow.style.display = opSel.value === "RECARGUE" ? "" : "none";
          });

          // Admin: al cambiar conductor, actualizar placas disponibles
          if (isAdmin) {
            var choferSel = Modal._el.querySelector("#m-chofer");
            var placaSel = Modal._el.querySelector("#m-placa");
            choferSel.addEventListener("change", function () {
              var cId = choferSel.value;
              var cams = cId ? _camiones.filter(function(c) { return c.activo && c.choferId === cId; }) : [];
              placaSel.innerHTML = cams.length
                ? cams.map(function(c) { return '<option value="' + c.patente + '">' + c.patente + '</option>'; }).join("")
                : '<option value="">Sin camiones asignados</option>';
            });

              var op = Modal.val("m-op");

              API.registros

                  tipoZona: Modal.val("m-zona") || undefined,

                  Modal.setLoading(false);
                  Toast.error(e.message);

      /* ─── Reportes ───────────────────────────────────────────────────────────── */

        function _loadReporteChofer(el, anio, mes) {

              '<div class="card"><div class="empty-state"><p>No tiene un perfil de chofer asignado.</p></div></div>';
            return;

          var filtro = { anio: anio, mes: mes };

          API.reportes
            .detalleChofer(session.choferId, filtro)
            .then(function (d) {
              var monthName = new Date(anio, mes - 1).toLocaleString("es-EC", {
                month: "long",
                year: "numeric",
              });
              var regRows = (d.registros || [])
                .map(function (r) {
                  return (
                    "<tr>" +
                    '<td data-label="Fecha">' + r.fecha + "</td>" +
                    '<td data-label="Placa">' + (r.placa || r.camionPatente || "-") + "</td>" +

                    btn.onclick = function () {
                      _openEdit(container, c);
                    };
                  if (btn.dataset.action === "des")
                    btn.onclick = function () {
                      Modal.show({
                        title: "Desactivar Chofer",
                        danger: true,
                        saveLabel: "Desactivar",
                        body:
                          "<p>&#191;Desactivar a <strong>" +
                          c.nombre +
                          "</strong>?</p>",
                        onSave: function () {
                          Modal.setLoading(true);
                          API.choferes
                            .desactivar(c.choferId)
                            .then(function () {
                              Modal.hide();
                              Toast.success("Chofer desactivado");
                              _load(container);

                dni = Modal.val("ch-d");

                return;

              Modal.setLoading(true);
              API.choferes
                .crear({
                  nombre: nombre,
                  dni: dni,
                  telefono: Modal.val("ch-t") || undefined,
                  fechaIngreso: Modal.val("ch-f") || undefined,
                  notas: Modal.val("ch-o") || undefined,

                  Modal.hide();
                  Toast.success("Chofer creado");
                  _load(container);

                .catch(function (e) {
                  Modal.setLoading(false);
                  Toast.error(e.message);

          Modal.show({

              Modal.setLoading(true);
              API.choferes
                .actualizar(c.choferId, {

                  _load(container);

                .catch(function (e) {
                  Modal.setLoading(false);
                  Toast.error(e.message);
                });
            },
          });
        }

        return {
          title: "Choferes",
          render: function (container) {
            _load(container);
          },
        };

      /* ─── Errores de Formulario ─────────────────────────────────────────────── */
      function makeFormErroresPage(session) {
        var isAdmin = session.rol === "ADMIN";
        var _data = [];
        var _choferes = [];
        var _camiones = [];

        function _estadoBadge(estado) {
          if (estado === "PENDIENTE")
            return '<span class="badge" style="background:#fbbc04;color:#333">PENDIENTE</span>';
          if (estado === "RESUELTO")
            return '<span class="badge badge-activo">RESUELTO</span>';
          if (estado === "IGNORADO")
            return '<span class="badge badge-inactivo">IGNORADO</span>';
          return '<span class="badge">' + estado + "</span>";
        }

        function _renderPage(container) {
          var rows = _data
            .map(function (e) {
              var isPendiente = e.estado === "PENDIENTE";
              var btns = "";
              if (isAdmin && isPendiente) {
                btns +=
                  '<button class="btn-icon btn-det" data-action="crear" data-id="' +
                  e.errorId +
                  '" title="Crear registro manualmente">Crear</button>' +
                  '<button class="btn-icon" style="background:#f1f3f4;color:#5f6368" data-action="ignorar" data-id="' +
                  e.errorId +
                  '" title="Ignorar este error">Ignorar</button>';
              }
              var rawObj = [];
              try { rawObj = JSON.parse(e.rawValues || "[]"); } catch (_) {}
              var rawResumen = Array.isArray(rawObj)
                ? rawObj.slice(0, 6).join(" | ")
                : e.rawValues;
              return (
                "<tr>" +
                "<td>" + UI.formatDateTime(e.timestamp) + "</td>" +
                "<td>" +
                (e.emailChofer || "-") +
                (isAdmin && e.usuarioRegistrado === false
                  ? '<br><span class="badge" style="background:#fce8e6;color:#b71c1c;font-size:10px">Sin usuario</span>'
                  : "") +
                "</td>" +
                '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                '<span class="fe-ver-detalle" data-id="' + e.errorId + '" style="cursor:pointer;color:var(--primary);text-decoration:underline dotted" title="Clic para ver detalle completo">' +
                e.mensajeError +
                "</span></td>" +
                '<td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted);font-size:12px">' +
                rawResumen + "</td>" +
                "<td>" + _estadoBadge(e.estado) + "</td>" +
                "<td>" + (e.resueltoPor || "-") + "</td>" +
                '<td><div class="action-btns">' + btns + "</div></td>" +
                "</tr>"
              );
            })
            .join("");

          var pendientes = _data.filter(function (e) {
            return e.estado === "PENDIENTE";
          }).length;
          container.innerHTML =
            '<div class="cards-grid" style="margin-bottom:16px">' +
            '<div class="stat-card"><div class="stat-label">Total errores</div><div class="stat-value">' +
            _data.length +
            "</div></div>" +
            '<div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-value" style="color:var(--warning)">' +
            pendientes +
            "</div></div>" +
            "</div>" +
            '<div class="card"><div class="card-title">Errores del Formulario</div>' +
            (_data.length === 0
              ? '<div class="empty-state"><div class="empty-state-icon">&#10003;</div><p>Sin errores pendientes</p></div>'
              : '<div class="table-wrapper"><table><thead><tr><th>Fecha</th><th>Placa / Ref.</th><th>Error</th><th>Datos enviados</th><th>Estado</th><th>Resuelto por</th><th>Acciones</th></tr></thead><tbody>' +
                rows +
                "</tbody></table></div>") +
            "</div>";

          container.querySelectorAll("[data-action]").forEach(function (btn) {
            btn.onclick = function () {
              var errorId = btn.dataset.id;
              var err = _data.filter(function (x) {
                return x.errorId === errorId;
              })[0];
              if (btn.dataset.action === "ignorar")
                _ignorar(container, errorId);
              if (btn.dataset.action === "crear") _openCrear(container, err);
            };
          });

          container.querySelectorAll(".fe-ver-detalle").forEach(function (span) {
            span.onclick = function () {
              var errorId = span.dataset.id;
              var err = _data.filter(function (x) { return x.errorId === errorId; })[0];
              if (!err) return;
              var rawObj = [];
              try { rawObj = JSON.parse(err.rawValues || "[]"); } catch (_) {}
              var rawHtml = "";
              if (Array.isArray(rawObj) && rawObj.length > 0) {
                var labels = ["Timestamp", "Transporte", "Ruta", "Placa", "Tipo Operación", "Tipo Zona", "Cantidad Recargues", "Kilometraje", "Rechazos", "Observaciones"];
                rawObj.forEach(function (v, i) {
                  rawHtml +=
                    '<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #f0f0f0">' +
                    '<span style="min-width:100px;font-weight:600;color:var(--text-muted);font-size:12px">' +
                    (labels[i] || ("Campo " + (i + 1))) + "</span>" +
                    '<span style="word-break:break-all">' + (v || "-") + "</span></div>";
                });
              } else {
                rawHtml = '<pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f8f9fa;padding:8px;border-radius:4px">' + (err.rawValues || "-") + "</pre>";
              }
              var resolvedSection = "";
              if (err.resueltoPor) {
                resolvedSection =
                  '<div style="margin-top:12px;padding:10px;background:#e6f4ea;border-radius:6px">' +
                  '<div style="font-size:12px;color:#2e7d32"><strong>Resuelto por:</strong> ' + err.resueltoPor + "</div>" +
                  (err.resueltoEn ? '<div style="font-size:12px;color:#2e7d32"><strong>Fecha resolución:</strong> ' + UI.formatDateTime(err.resueltoEn) + "</div>" : "") +
                  (err.registroId ? '<div style="font-size:12px;color:#2e7d32"><strong>Registro creado:</strong> ' + err.registroId + "</div>" : "") +
                  "</div>";
              }
              Modal.show({
                title: "Detalle del error",
                body:
                  '<div style="margin-bottom:12px">' +
                  '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">FECHA</div>' +
                  '<div>' + UI.formatDateTime(err.timestamp) + "</div></div>" +
                  '<div style="margin-bottom:12px">' +
                  '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">PLACA / REFERENCIA</div>' +
                  '<div>' + (err.emailChofer || "-") + "</div></div>" +
                  '<div style="margin-bottom:12px">' +
                  '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">ESTADO</div>' +
                  '<div>' + _estadoBadge(err.estado) + "</div></div>" +
                  '<div style="margin-bottom:12px">' +
                  '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">MENSAJE DE ERROR</div>' +
                  '<div style="background:#fce8e6;border-radius:6px;padding:10px;word-break:break-word;font-size:13px;color:#b71c1c">' + err.mensajeError + "</div></div>" +
                  '<div style="margin-bottom:12px">' +
                  '<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">DATOS ENVIADOS POR EL FORMULARIO</div>' +
                  rawHtml + "</div>" +
                  resolvedSection,
              });
            };
          });
        }

        function _load(container) {
          UI.showLoading(container);
          var p = isAdmin
            ? Promise.all([
                API.formErrores.getAll(),
                API.choferes.getAll(),
                API.camiones.getAll(),
              ])
            : Promise.all([
                API.formErrores.getAll(),
                Promise.resolve([]),
                Promise.resolve([]),
              ]);
          p.then(function (r) {
            _data = r[0];
            _choferes = r[1];
            _camiones = r[2];
            _renderPage(container);
          }).catch(function (e) {
            UI.showError(container, e.message);
          });
        }

        function _ignorar(container, errorId) {
          if (
            !confirm("&#191;Ignorar este error? Quedará marcado como IGNORADO.")
          )
            return;
          API.formErrores
            .ignorar(errorId)
            .then(function () {
              Toast.success("Marcado como ignorado");
              _load(container);
            })
            .catch(function (e) {
              Toast.error(e.message);
            });
        }

        function _openCrear(container, err) {
          // Parsear rawValues para pre-rellenar campos
          // Nuevo orden: [0]=timestamp, [1]=transporte, [2]=ruta, [3]=placa, [4]=tipoOp, [5]=tipoZona, [6]=cantidad, [7]=km, [8]=rechazos, [9]=obs
          var rawArr = [];
          try { rawArr = JSON.parse(err.rawValues || "[]"); } catch (_) {}
          var placaRaw = (rawArr[3] || "").toUpperCase();
          var opRaw = (rawArr[4] || "ENTREGA").toUpperCase();
          var zonaRaw = (rawArr[5] || "URBANO").toUpperCase();
          var cantidadRaw = parseInt(rawArr[6]) || 1;
          var kmRaw = rawArr[7] || "";
          var obsRaw = rawArr[9] || "";
          var transporteRaw = rawArr[1] || "";
          var rutaRaw = rawArr[2] || "";

          // Resolver camión por placa
          var camionPre = placaRaw ? _camiones.filter(function(c) { return c.patente.toUpperCase() === placaRaw; })[0] : null;
          var chSel = UI.choferOptions(_choferes, camionPre ? camionPre.choferId : (err.choferId || ""));
          var cantOpts = [1,2,3,4,5].map(function(n) {
            return '<option value="' + n + '"' + (cantidadRaw === n ? " selected" : "") + ">" + n + "</option>";
          }).join("");

          Modal.show({
            title: "Crear Registro desde Error",
            body:
              '<p style="margin-bottom:12px;color:var(--text-muted);font-size:13px">Error: <em>' + err.mensajeError + "</em></p>" +
              '<div class="form-row">' +
              '<div class="form-group"><label class="form-label">Fecha *</label><input type="date" class="form-control" id="fe-fecha" value="' + isoToday() + '"></div>' +
              '<div class="form-group"><label class="form-label">Placa *</label><input type="text" class="form-control" id="fe-placa" value="' + placaRaw + '" placeholder="RBH-1239"></div>' +
              '</div><div class="form-row">' +
              '<div class="form-group"><label class="form-label">Transporte *</label><input type="number" class="form-control" id="fe-transporte" value="' + transporteRaw + '"></div>' +
              '<div class="form-group"><label class="form-label">Ruta *</label><input type="number" class="form-control" id="fe-ruta" value="' + rutaRaw + '"></div>' +
              '</div><div class="form-row">' +
              '<div class="form-group"><label class="form-label">Operaci&#243;n *</label><select class="form-control" id="fe-op"><option value="ENTREGA"' + (opRaw === "ENTREGA" ? " selected" : "") + '>Entrega</option><option value="RECARGUE"' + (opRaw === "RECARGUE" ? " selected" : "") + '>Recargue</option></select></div>' +
              '<div class="form-group"><label class="form-label">Zona *</label><select class="form-control" id="fe-zona"><option value="URBANO"' + (zonaRaw === "URBANO" ? " selected" : "") + '>Urbano</option><option value="FORANEO"' + (zonaRaw === "FORANEO" ? " selected" : "") + '>For\u00e1neo</option><option value="EXTRAFORANEO"' + (zonaRaw === "EXTRAFORANEO" ? " selected" : "") + '>Extrafor\u00e1neo</option></select></div>' +
              '</div><div class="form-row" id="fe-cant-row" style="' + (opRaw === "RECARGUE" ? "" : "display:none") + '">' +
              '<div class="form-group"><label class="form-label">Cantidad recargues</label><select class="form-control" id="fe-cantidad">' + cantOpts + '</select></div>' +
              '<div class="form-group"></div>' +
              '</div><div class="form-row">' +
              '<div class="form-group"><label class="form-label">Chofer *</label><select class="form-control" id="fe-chofer">' + chSel + '</select></div>' +
              '<div class="form-group"><label class="form-label">Kilometraje</label><input type="number" class="form-control" id="fe-km" value="' + kmRaw + '"></div>' +
              '</div><div class="form-group"><label class="form-label">Observaciones</label><textarea class="form-control" id="fe-obs" rows="2">' + obsRaw + "</textarea></div>",
            onSave: function () {
              var fecha = Modal.val("fe-fecha");
              var placa = Modal.val("fe-placa").toUpperCase();
              var choferId = Modal.val("fe-chofer");
              if (!fecha || !placa || !choferId) {
                Toast.error("Completa todos los campos requeridos");
                return;
              }
              var camion = _camiones.filter(function(c) { return c.patente.toUpperCase() === placa; })[0];
              if (!camion) { Toast.error("No se encontró camión con placa " + placa); return; }
              var op = Modal.val("fe-op");
              Modal.setLoading(true);
              API.registros
                .crear({
                  fecha: fecha,
                  choferId: choferId,
                  camionId: camion.camionId,
                  placa: placa,
                  transporte: Modal.val("fe-transporte"),
                  ruta: Modal.val("fe-ruta"),
                  tipoOperacion: op,
                  tipoZona: Modal.val("fe-zona"),
                  cantidadRecargues: op === "RECARGUE" ? parseInt(Modal.val("fe-cantidad")) || 1 : 1,
                  kilometraje: parseFloat(Modal.val("fe-km")) || 0,
                  tieneRechazos: false,
                  observaciones: Modal.val("fe-obs") || undefined,
                  origen: "MANUAL",
                })
                .then(function (reg) {
                  return API.formErrores.marcarResuelto(err.errorId, reg.registroId);
                })
                .then(function () {
                  Modal.hide();
                  Toast.success("Registro creado y error marcado como resuelto");
                  _load(container);
                })
                .catch(function (e) {
                  Modal.setLoading(false);
                  Toast.error(e.message);
                });
            },
          });

          var opSel = Modal._el.querySelector("#fe-op");
          var cantRow = Modal._el.querySelector("#fe-cant-row");
          opSel.addEventListener("change", function() {
            cantRow.style.display = opSel.value === "RECARGUE" ? "" : "none";
          });
        }

        return {
          title: "Errores de Formulario",
          render: function (container) {
            _load(container);
          },
        };
      }

      /* ─── Bootstrap ──────────────────────────────────────────────────────────── */
      document.addEventListener("DOMContentLoaded", function () {
        var session = window.__SESSION__;

        if (!session) {
          var tplNA = document.getElementById("tpl-no-access");
          document.getElementById("app").innerHTML = "";
          document
            .getElementById("app")
            .appendChild(tplNA.content.cloneNode(true));
          return;
        }

        var tpl = document.getElementById("tpl-layout");
        document.getElementById("app").innerHTML = "";
        document.getElementById("app").appendChild(tpl.content.cloneNode(true));

        document.getElementById("app-nombre").textContent =
          window.__APP_NOMBRE__ || "Sistema";
        document.getElementById("sidebar-user-email").textContent =
          session.email || "";
        document.getElementById("topbar-user").textContent =
          session.email || "";
        var rol = session.rol || "";
        document.getElementById("topbar-role").textContent = rol;
        document.getElementById("topbar-role").className =
          "badge badge-" + rol.toLowerCase();

        document
          .getElementById("btn-logout")
          .addEventListener("click", function () {
            Modal.show({
              title: "Cerrar sesi\u00f3n",
              danger: true,
              saveLabel: "Cerrar sesi\u00f3n",
              body:
                "<p>Para cerrar sesi\u00f3n debes salir de tu cuenta Google.</p>" +
                '<p style="margin-top:8px;color:var(--text-muted);font-size:13px">Ser\u00e1s redirigido a la p\u00e1gina de cierre de sesi\u00f3n de Google. Tendr\u00e1s que volver a iniciar sesi\u00f3n la pr\u00f3xima vez.</p>',
              onSave: function () {
                window.location.href = "https://accounts.google.com/Logout";
              },
            });
          });

        function _closeSidebar() {
          document.getElementById("sidebar").classList.remove("open");
          document.getElementById("sidebar-backdrop").classList.remove("visible");
        }
        document
          .getElementById("sidebar-toggle")
          .addEventListener("click", function () {
            var sidebar = document.getElementById("sidebar");
            var backdrop = document.getElementById("sidebar-backdrop");
            sidebar.classList.toggle("open");
            backdrop.classList.toggle("visible", sidebar.classList.contains("open"));
          });
        document
          .getElementById("sidebar-backdrop")
          .addEventListener("click", _closeSidebar);
        document.getElementById("sidebar-nav").addEventListener("click", function () {
          _closeSidebar();
        });

        buildMenu(session);
        registerRoutes(session);
        Router.start();
      });

      function buildMenu(session) {
        var nav = document.getElementById("sidebar-nav");
        var isAdmin = session.rol === "ADMIN";
        var html = '<div class="nav-section">General</div>';
        [
          { route: "dashboard", icon: "&#128202;", label: "Dashboard" },
          { route: "registros", icon: "&#128203;", label: "Registros" },
          { route: "reportes", icon: "&#128200;", label: "Reportes" },
        ].forEach(function (i) {
          html +=
            '<div class="nav-item" data-route="' +
            i.route +
            '" onclick="Router.navigate(\'' +
            i.route +
            '\')"><span class="nav-icon">' +
            i.icon +
            "</span>" +
            i.label +
            "</div>";
        });
        // Errores de formulario visible para todos (admin ve todos, chofer sus propios)
        html += '<div class="nav-section">Formulario</div>';
        html +=
          '<div class="nav-item" data-route="form-errores" onclick="Router.navigate(\'form-errores\')"><span class="nav-icon">&#9888;</span>Errores Form</div>';

        if (isAdmin) {
          html += '<div class="nav-section">Administraci\u00f3n</div>';
          [
            { route: "tarifas", icon: "&#36;", label: "Tarifas" },
            { route: "choferes", icon: "&#128100;", label: "Choferes" },
            { route: "camiones", icon: "&#128667;", label: "Camiones" },
            { route: "usuarios", icon: "&#9881;", label: "Usuarios" },
            { route: "auditoria", icon: "&#128269;", label: "Auditor\u00eda" },
          ].forEach(function (i) {
            html +=
              '<div class="nav-item" data-route="' +
              i.route +
              '" onclick="Router.navigate(\'' +
              i.route +
              '\')"><span class="nav-icon">' +
              i.icon +
              "</span>" +
              i.label +
              "</div>";
          });
        }
        nav.innerHTML = html;
      }

      function registerRoutes(session) {
        Router.register("dashboard", makeDashboardPage(session));
        Router.register("registros", makeRegistrosPage(session));
        Router.register("reportes", makeReportesPage(session));
        Router.register("tarifas", makeTarifasPage());
        Router.register("choferes", makeChoferesPage());
        Router.register("camiones", makeCamionesPage());
        Router.register("usuarios", makeUsuariosPage());
        Router.register("auditoria", makeAuditoriaPage());
        Router.register("form-errores", makeFormErroresPage(session));
      }
    </script>
  </body>
</html>
